<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voyage-Ed CRM</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>" />
    <script type="module" crossorigin src="/assets/index-PVaRlfhR.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-SIwY82C9.js">
  
    <!-- Mobile Responsive Fix — Voyage-Ed CRM -->
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#f97316"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="VE CRM"/>
    <link rel="apple-touch-icon" href="/icon-192.png"/>
    <style>
      /* ===== VOYAGE-ED CRM MOBILE FIX ===== */
      *, *::before, *::after { box-sizing: border-box !important; }
      html, body { overflow-x: hidden !important; max-width: 100vw !important; }
      #root { overflow-x: hidden !important; }

      /* Grid overrides for mobile */
      @media (max-width: 768px) {
        .grid2 { grid-template-columns: 1fr !important; }
        .grid3 { grid-template-columns: 1fr !important; }
        .grid4 { grid-template-columns: 1fr 1fr !important; }

        /* Cards full width */
        .card {
          padding: 16px 14px !important;
          border-radius: 14px !important;
          margin-bottom: 12px !important;
        }
        .stat {
          padding: 14px !important;
          border-radius: 12px !important;
        }

        /* Buttons touch-friendly */
        .btn { min-height: 44px !important; padding: 10px 18px !important; }
        .btn-sm { min-height: 40px !important; }
        .btn-danger { min-height: 36px !important; }

        /* Tabs scrollable */
        [style*="display:flex"][style*="borderBottom"],
        [style*="display: flex"][style*="border-bottom"] {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          white-space: nowrap !important;
        }
        .tab {
          padding: 10px 14px !important;
          font-size: 13px !important;
          flex-shrink: 0 !important;
        }

        /* Fix flex rows that break on mobile */
        [style*="display:flex"][style*="gap"] {
          flex-wrap: wrap !important;
        }

        /* Sidebar / nav if any */
        [style*="width:260px"],
        [style*="width: 260px"],
        [style*="width:280px"],
        [style*="width:240px"] {
          width: 100% !important;
          max-width: 100% !important;
        }

        /* Forms full width */
        input, select, textarea {
          width: 100% !important;
          font-size: 16px !important;
          min-height: 44px !important;
        }

        /* Tables scroll horizontally */
        table {
          display: block !important;
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          white-space: nowrap !important;
        }

        /* Top header/nav bar */
        [style*="padding:0 32px"],
        [style*="padding: 0 32px"],
        [style*="padding:0 24px"] {
          padding: 0 16px !important;
        }

        /* Main content padding */
        [style*="padding:32px"],
        [style*="padding: 32px"],
        [style*="padding:28px"],
        [style*="padding:24px 32px"] {
          padding: 16px !important;
        }

        /* Modal / popup full screen on mobile */
        [style*="borderRadius:20px"][style*="padding:32px"],
        [style*="border-radius:20px"][style*="padding:32px"] {
          padding: 20px 16px !important;
          margin: 8px !important;
          max-width: calc(100vw - 16px) !important;
        }

        /* Font size adjustments */
        [style*="fontSize:22"],
        [style*="font-size:22"] { font-size: 18px !important; }
        [style*="fontSize:28"],
        [style*="font-size:28"] { font-size: 22px !important; }

        /* Section headings */
        .sec-head { font-size: 10px !important; letter-spacing: 1.5px !important; }

        /* vrow - lead/visit rows */
        .vrow {
          padding: 14px !important;
          border-radius: 12px !important;
        }
        .prow { padding: 10px !important; }

        /* Overflow fix for all major containers */
        [style*="minHeight:100vh"],
        [style*="min-height:100vh"] {
          min-height: 100svh !important;
        }
      }

      @media (max-width: 480px) {
        .grid4 { grid-template-columns: 1fr !important; }
        .btn-sm { font-size: 12px !important; padding: 8px 12px !important; }
        .card { padding: 14px 12px !important; }
        [style*="fontSize:24"],
        [style*="font-size:24"] { font-size: 18px !important; }
      }

      /* Bottom nav bar safe area for notch phones */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        body { padding-bottom: env(safe-area-inset-bottom) !important; }
      }
      /* ===== END MOBILE FIX ===== */
    </style>
    <script>
      // Register service worker for PWA/APK
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body style="background:#0d1117;margin:0">
    <div id="root"></div>
  </body>
</html>
