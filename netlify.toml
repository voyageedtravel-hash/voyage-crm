[build]
  base = "frontend"
  publish = "build"
  command = "yarn install --frozen-lockfile && yarn build"

[build.environment]
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.22"
  # Prevent Netlify from treating ESLint warnings as errors.
  # Real errors still fail the build; only warnings are tolerated.
  CI = "false"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
