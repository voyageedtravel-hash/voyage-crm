apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.voyageed.crm'

    defaultConfig {
        applicationId "com.voyageed.crm"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    signingConfigs {
        release {
            storeFile file('../voyage-ed-crm.keystore')
            storePassword 'VoyageEdCRM2026'
            keyAlias 'voyage-ed-crm'
            keyPassword 'VoyageEdCRM2026'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
}
