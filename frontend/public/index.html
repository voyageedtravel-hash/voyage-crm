<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Viewport: viewport-fit=cover so we can extend into Fold5 notch/edge areas.
         user-scalable=yes so pinch-zoom still works on dense tables. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />

    <!-- Branded colours for Chrome address bar (folded) and status bar (installed PWA). -->
    <meta name="theme-color" content="#0d1b3e" />
    <meta name="msapplication-navbutton-color" content="#0d1b3e" />

    <!-- iOS PWA support (in case ever opened on iPad). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voyage-Ed" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Chrome mobile / Android PWA specific. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Voyage-Ed CRM" />

    <meta name="description" content="Voyage-Ed CRM — deals, proposals, and operations for Voyage-Ed Travels." />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Voyage-Ed CRM</title>
    <meta name="ve-build" content="2026-09-10-pwa-fold5" />

    <style>
      /* ─── Fold5 & general mobile PWA CSS ──────────────────────────────
         The full CRM UI is styled elsewhere; this block only sets up the
         install-time layout so the PWA feels native from the very first
         paint (before React hydrates).

         Fold5 form-factors:
         - Cover screen (folded): 904 × 2316 px @ ~21:9 tall aspect (~6.2")
         - Main screen (unfolded): 1812 × 2176 px @ ~5:6 near-square (~7.6")
         - Split-screen (App1 | App2 side-by-side): each app ~906 px wide

         The CRM's own React styles already handle >= 1400px well (desktop).
         The additions below make the < 1400px experience Fold-friendly. */

      html, body {
        margin: 0;
        padding: 0;
        background: #0d1b3e; /* matches theme_color so no white flash on cold start */
        overscroll-behavior-y: none; /* stop the whole page bouncing when a list is scrolled */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }

      /* Extend paint into notch/edge areas on the folded cover screen. */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      /* Splash screen shown while the JS bundle downloads on first launch.
         Removed as soon as React mounts (root gets children). */
      #ve-boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0d1b3e; color: #c9961a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 999;
      }
      #ve-boot .v { font-size: 96px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
      #ve-boot .sub { color: #fff; font-size: 12px; letter-spacing: 4px; font-weight: 700; }
      #ve-boot .hint { color: #7c8ba8; font-size: 10px; margin-top: 24px; letter-spacing: 1px; }
      #root:not(:empty) ~ #ve-boot { display: none; }

      /* When the app is installed as a PWA it launches in standalone
         window mode. Chrome removes its own toolbar but leaves a status
         bar. We put a colour-matched safe padding under it. */
      @media (display-mode: standalone), (display-mode: window-controls-overlay) {
        body { background: #eef1f7; } /* CRM canvas colour */
      }

      /* ─── Fold5-specific tweaks ───────────────────────────────────────
         Cover screen (folded, ~904 wide) — apply tighter compact layout. */
      @media (max-width: 950px) {
        /* Ensure any absolute-positioned side panels don't overflow.
           The CRM already flexes below 900px so this is a safety net. */
        body { overflow-x: hidden; }

        /* Increase minimum touch target to Google's 44px recommendation
           for anything that acts as a button in the CRM. Non-invasive:
           only kicks in on narrow viewports. */
        button, input[type="button"], input[type="submit"], a.v2-cta, a.v2-hero-btn {
          min-height: 40px;
        }
      }

      /* Main screen (unfolded, ~1812 wide) uses desktop layout unmodified.
         Split-screen (~906 wide when app is on one side) uses the folded rules above. */

      noscript {
        display: block; padding: 40px; color: #fff; text-align: center; font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>Voyage-Ed CRM requires JavaScript. Please enable it in your browser.</noscript>
    <div id="root"></div>

    <!-- Cold-start splash (removed by CSS once React mounts) -->
    <div id="ve-boot" aria-hidden="true">
      <div class="v">V</div>
      <div class="sub">VOYAGE-ED</div>
      <div class="hint">Loading your CRM…</div>
    </div>

    <script>
      // Service worker registration + auto-reload on new deploy.
      // Without the reload step, users kept seeing stale bundles for
      // days because Chrome's default is to wait until every tab is
      // closed before activating a new SW.
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            // Ping the SW to check for updates on every load — makes new
            // deploys visible on the next open, not days later.
            reg.update().catch(function () {});

            // When a new SW finishes installing behind the current one,
            // tell it to skipWaiting so it activates immediately.
            function promptNewSW() {
              if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            if (reg.waiting) promptNewSW();
            reg.addEventListener('updatefound', function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', function () {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  promptNewSW();
                }
              });
            });

            // When the new SW takes control, force one reload so the
            // page runs the fresh JS bundle. Guard against reload loops
            // by only reloading if we haven't already just reloaded.
            var reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (reloaded) return;
              reloaded = true;
              window.location.reload();
            });
          }).catch(function () { /* silent */ });
        });
      }

      // Capture install prompt so we can show a custom button.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__veInstallPrompt = e;
        // Dispatch a custom event so React (or the fallback DOM button
        // below) can react and reveal the install button.
        window.dispatchEvent(new CustomEvent('ve-install-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__veInstallPrompt = null;
        var btn = document.getElementById('ve-install-btn');
        if (btn) btn.remove();
      });

      // Floating "Install App" button — only shown when browser has
      // fired beforeinstallprompt AND we're not already running as a
      // standalone PWA. Cleaner UX than digging through Chrome's menu.
      function veShowInstallBtn() {
        if (window.matchMedia('(display-mode: standalone)').matches) return;
        if (document.getElementById('ve-install-btn')) return;
        var btn = document.createElement('button');
        btn.id = 've-install-btn';
        btn.innerHTML = '📱 Install App';
        btn.style.cssText = 'position:fixed;bottom:20px;left:20px;z-index:9999;background:#0d1b3e;color:#c9961a;border:2px solid #c9961a;border-radius:999px;padding:12px 20px;font-size:13px;font-weight:800;letter-spacing:.5px;cursor:pointer;box-shadow:0 6px 20px rgba(13,27,62,.35);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
        btn.onclick = function () {
          if (!window.__veInstallPrompt) {
            alert('Install nahi ho pa raha — Chrome menu (three dots top-right) → "Install app" try karo, ya browser refresh karke dobara try karo.');
            return;
          }
          window.__veInstallPrompt.prompt();
          window.__veInstallPrompt.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') {
              btn.remove();
              window.__veInstallPrompt = null;
            }
          });
        };
        document.body.appendChild(btn);
      }
      window.addEventListener('ve-install-available', veShowInstallBtn);
      // Also try after a short delay in case the event already fired
      // before this handler was attached.
      setTimeout(function () {
        if (window.__veInstallPrompt) veShowInstallBtn();
      }, 1500);

      // ─── New-deploy detector ───────────────────────────────────────
      // A long-open tab keeps running the old JS bundle after a deploy
      // (the SW only updates when sw.js itself changes). Every 3 min and
      // whenever the tab regains focus, fetch index.html fresh and
      // compare its main.<hash>.js with the one this page loaded. If it
      // differs, show a refresh banner (no auto-reload — an open modal
      // with typed data would be lost).
      (function () {
        function currentMain() {
          var s = Array.prototype.slice.call(document.querySelectorAll('script[src]'))
            .map(function (x) { return x.getAttribute('src') || ''; })
            .filter(function (src) { return /\/static\/js\/main\.[a-z0-9]+\.js/.test(src); })[0];
          var m = s && s.match(/main\.([a-z0-9]+)\.js/);
          return m ? m[1] : null;
        }
        var mine = null;
        function showBanner() {
          if (document.getElementById('ve-update-banner')) return;
          var b = document.createElement('div');
          b.id = 've-update-banner';
          b.innerHTML = '🔄 CRM ka naya update aaya hai — <u>Refresh karo</u>';
          b.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100000;background:#0d1b3e;color:#f0c842;border:2px solid #c9961a;border-radius:999px;padding:10px 20px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(13,27,62,.35);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
          b.onclick = function () { window.location.reload(); };
          document.body.appendChild(b);
        }
        function check() {
          if (!mine) mine = currentMain();
          if (!mine) return;
          fetch('/index.html?_v=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : ''; })
            .then(function (html) {
              var m = html && html.match(/\/static\/js\/main\.([a-z0-9]+)\.js/);
              if (m && m[1] !== mine) showBanner();
            })
            .catch(function () {});
        }
        window.addEventListener('load', function () { setTimeout(check, 5000); });
        setInterval(check, 3 * 60 * 1000);
        window.addEventListener('focus', check);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      })();

      // ─── Nuclear reset ──────────────────────────────────────────────
      // A "Force Refresh" mechanism for when a broken SW or wrong-cache
      // scenario has trapped the user in stale content. Triple-tap the
      // Voyage-Ed logo splash area (or add ?reset=1 to any URL) and it
      // wipes every service worker + every cache, then hard-reloads.
      window.veHardReset = async function () {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
        } catch (e) {}
        // Force network reload, no cache
        window.location.replace(window.location.pathname + '?_freshload=' + Date.now());
      };
      if (/[?&]reset=1/.test(window.location.search)) {
        window.veHardReset();
      }
    </script>
  </body>
</html>
