name: Build Voyage-Ed CRM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore $GITHUB_WORKSPACE/android/voyage-ed-crm.keystore \
            -alias voyage-ed-crm -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass VoyageEdCRM2026 -keypass VoyageEdCRM2026 \
            -dname "CN=Voyage-Ed, OU=CRM, O=Voyage-Ed, L=Mohali, ST=Punjab, C=IN"

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/voyage-ed-crm.keystore \
            -Pandroid.injected.signing.store.password=VoyageEdCRM2026 \
            -Pandroid.injected.signing.key.alias=voyage-ed-crm \
            -Pandroid.injected.signing.key.password=VoyageEdCRM2026 \
            --no-daemon

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoyageEd-CRM-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
