name: Build Voyage-Ed CRM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore voyage-ed-crm.keystore \
            -alias voyage-ed-crm -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass VoyageEdCRM2026 -keypass VoyageEdCRM2026 \
            -dname "CN=Voyage-Ed, OU=CRM, O=Voyage-Ed, L=Mohali, ST=Punjab, C=IN"
          echo "✅ Keystore generated"
          ls -la voyage-ed-crm.keystore

      - name: Make Gradle wrapper executable
        run: |
          chmod +x gradlew 2>/dev/null || true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/voyage-ed-crm.keystore \
            -Pandroid.injected.signing.store.password=VoyageEdCRM2026 \
            -Pandroid.injected.signing.key.alias=voyage-ed-crm \
            -Pandroid.injected.signing.key.password=VoyageEdCRM2026

      - name: Locate APK
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" | sort
          echo "=== AAB files ==="
          find . -name "*.aab" | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoyageEd-CRM-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
