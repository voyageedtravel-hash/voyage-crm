name: Build Voyage-Ed CRM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore voyage-ed-crm.keystore \
            -alias voyage-ed-crm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass VoyageEdCRM2026 \
            -keypass VoyageEdCRM2026 \
            -dname "CN=Voyage-Ed Travels, OU=CRM, O=Voyage-Ed, L=Mohali, ST=Punjab, C=IN"
          echo "✅ Keystore generated"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" || true

      - name: Run Bubblewrap build (non-interactive)
        run: |
          mkdir -p twa-project
          cp twa-manifest.json twa-project/twa-manifest.json
          cp voyage-ed-crm.keystore twa-project/voyage-ed-crm.keystore
          cd twa-project
          bubblewrap build \
            --manifest ../twa-manifest.json \
            --skipPwaValidation \
            --signingKeyPath ./voyage-ed-crm.keystore \
            --signingKeyAlias voyage-ed-crm \
            --signingKeyStorePassword VoyageEdCRM2026 \
            --signingKeyPassword VoyageEdCRM2026 || true

      - name: Find APK files
        run: |
          echo "=== APK files found ==="
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK yet"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: voyage-ed-crm-apk-${{ github.run_number }}
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn
          retention-days: 90
