name: Build Voyage-Ed CRM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" "platforms;android-28"

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/voyage-ed-crm.keystore \
            -alias voyage-ed-crm -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass VoyageEdCRM2026 -keypass VoyageEdCRM2026 \
            -dname "CN=Voyage-Ed, OU=CRM, O=Voyage-Ed, L=Mohali, ST=Punjab, C=IN"

      - name: Build APK with Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK
        run: |
          find . -name "*.apk" 2>/dev/null
          ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "No APK yet"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoyageEd-CRM-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
