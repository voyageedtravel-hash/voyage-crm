plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voyageed.crm'
    compileSdk 34

    defaultConfig {
        applicationId "com.voyageed.crm"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile     file('../voyage-ed-crm.keystore')
            storePassword 'VoyageEdCRM2026'
            keyAlias      'voyage-ed-crm'
            keyPassword   'VoyageEdCRM2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
